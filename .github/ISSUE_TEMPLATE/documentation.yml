name: Documentation
description: Improve or fix documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve our documentation!
  
  - type: dropdown
    id: doc-type
    attributes:
      label: Type of Documentation
      description: What type of documentation needs improvement?
      options:
        - README
        - API Documentation
        - Tutorial/Guide
        - Code Comments
        - Other
    validations:
      required: true
  
  - type: textarea
    id: issue
    attributes:
      label: Issue with Current Documentation
      description: What's wrong or missing in the current documentation?
      placeholder: Describe the issue...
    validations:
      required: true
  
  - type: textarea
    id: improvement
    attributes:
      label: Suggested Improvement
      description: How should the documentation be improved?
      placeholder: Suggest improvements...
    validations:
      required: true
  
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Where is this documentation located?
      placeholder: File path or URL...
    validations:
      required: false
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context
      placeholder: Any additional information...
    validations:
      required: false
