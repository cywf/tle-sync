name: Sync TLE Data

on:
  schedule:
    - cron: '0 4 * * *'    # daily at 04:00 UTC (~midnight US-EDT)
  workflow_dispatch:       # allows manual runs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with: python-version: '3.x'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch & update TLEs
        env:
          NOTION_TOKEN:     ${{ secrets.NOTION_TOKEN }}
          NOTION_LEO_DB_ID: ${{ secrets.NOTION_LEO_DB_ID }}
          NOTION_GEO_DB_ID: ${{ secrets.NOTION_GEO_DB_ID }}
        run: python scripts/update_tle.py

      - name: Commit updated TLE files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add tle_data/
          git diff --quiet || git commit -m "chore: daily TLE update"
          git push
